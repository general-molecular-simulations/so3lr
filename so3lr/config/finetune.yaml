workdir: null  # Working directory, i.e., for saving the checkpoints and log. During finetuning, this is set via the CLI command so keep as null.
# Fine-tuning on energies and forces only. The data cannot tell short-range from
# long-range energy, so plain full fine-tuning (--strategy full) drifts the predicted
# charges and a0/C6 ratios: C6 by 15-67 % and dipole angles 2-4x worse in our tests.
# --strategy freeze_long_range does NOT prevent this (the frozen heads read a backbone
# that keeps training). Use one of these, with energy weight 1.0 (see loss_weights):
#   1. Anchors (best accuracy): --strategy full + training.long_range_anchor_weights.
#      a0/C6 stay within ~1 % of the pretrained model, charges ~0.006 e; out-of-domain
#      dipoles still degrade, by about half as much as full fine-tuning.
#   2. Exact long range: --strategy readout_only + the residual readout below. Charges,
#      a0/C6 and dipoles stay bit-identical to the pretrained model; 85-100 % of the
#      force gain of recipe 1.
#   3. Pseudo-labels (recipe 1 offline, e.g. a different teacher model; matched recipe 1
#      to the third digit, tested at energy weight 0.01 only): write the
#      teacher's predictions into the data and train them as targets, --strategy full:
#        so3lr eval --datafile data.extxyz --save-to teacher.extxyz
#            --targets energy,forces,partial_charges,a0_ratios,c6_ratios
#      then copy the partial_charges_so3lr / a0_ratios_so3lr / c6_ratios_so3lr arrays
#      into data.extxyz as partial_charges / a0_ratios / c6_ratios and set
#      loss_weights partial_charges, hirshfeld_ratios and c6_ratios to 1.0.
# The labels must treat dispersion like SO3LR does: SO3LR keeps its own dispersion term,
# so fitting dispersion-free energies (plain DFT without D3/D4/MBD) teaches every
# recipe to underbind non-covalent complexes.
# The checkpoint defines the model; a finetune config can only ADD a residual energy
# readout: a per-atom MLP added to the pretrained one, zero at the start (recipe 2).
# model:
#   energy_residual_mlp_widths: [512, 512]
#   energy_residual_inputs: all_layers  # or 'last': only the final-layer features
neighborlist_format_lr: sparse
data:
  filepath: null  # Path to the data file. During finetuning, this is set via the CLI command so keep as null.
  energy_unit: eV  # Energy unit.
  length_unit: Angstrom  # Length unit.
  electric_charge_unit: e  # Electric charge unit.
  dipole_vec_unit: e * Angstrom  # Dipole vector unit.
  shift_mode: null  # Options: null (no shifts), mean (uniform per-atom shift), lse (per-element least-squares fit), custom (use energy_shifts below).
  energy_shifts: null  # Energy shifts in eV to subtract.
  split_seed: 42  # Seed using for splitting the data into training, validation and test.
  neighbors_lr_bool: true  # Calculate long-range neighborhood indices. Required for modules like DispersionEnergy.
  neighbors_lr_cutoff: 100  # Cutoff for calculating the long-range neighborhoods in Angstrom. Is converted to the
  # data set units internally. Note that it is not required to be equal to the lr_cutoff of the model.
  # E.g. one can calculate neighbors up to 50 Ang and use no long-range cutoff in the model during training at all.
  # More details: https://so3lr.github.io/training/finetuning/
  avg_num_neighbors: null  # Average number of neighbors per atom in the data set. If not set, it will be calculated from the data.
  filter:
    min_distance: 0.25  # Minimum distinct-atom distance in Angstrom; TFDS applies the minimum image on configured PBC axes.
    max_force: 25.  # Maximum absolute force component in eV/Angstrom; TFDS also rejects non-finite forces.
optimizer:
  name: adamw  # Name of the optimizer. See https://optax.readthedocs.io/en/latest/api.html#common-optimizers for available ones.
  optimizer_args: null
  learning_rate: 0.0001  # Learning rate to use.
  learning_rate_schedule: exponential_decay  # Which learning rate schedule to use. See https://optax.readthedocs.io/en/latest/api.html#optimizer-schedules for available ones.
  learning_rate_schedule_args:  # Arguments passed to the learning rate schedule. See https://optax.readthedocs.io/en/latest/api.html#optimizer-schedules.
    decay_rate: 0.75
    transition_steps: 125000
  gradient_clipping: identity
  gradient_clipping_args: null
  num_of_nans_to_ignore: 0  # Number of repeated update/gradient steps that ignore NaNs before raising on error.
training:
  allow_restart: true  # If a checkpoint dir already exists in workdir, RESUME finetuning from it (no checkpoints are overwritten). Set false to refuse and require a fresh workdir.
  num_epochs: 100  # Number of epochs.
  num_train: null  # Number of training points to draw from data.filepath. The CLI flag --num-train takes precedence when set.
  num_valid: null  # Number of validation points to draw from data.filepath. The CLI flag --num-valid takes precedence when set.
  batch_max_num_nodes: null  # Maximal number of nodes per batch. Must be at least maximal number of atoms + 1 in the data set.
  batch_max_num_edges: null  # Maximal number of edges per batch. Must be at least maximal number of edges + 1 in the data set.
  batch_max_num_pairs: null
  # If batch_max_num_nodes and batch_max_num_edges is set to null, they will be determined from the max_num_of_graphs.
  # If they are set to values, each batch will contain as many molecular structures/graphs such none of the three values
  # batch_max_num_nodes, batch_max_num_edges and batch_max_num_of_graphs is exceeded.
  batch_max_num_graphs: 8  # Maximal number of graphs per batch.
  # Since there is one padding graph involved for an effective batch size of 5 corresponds to 6 max_num_graphs.
  batch_n_proc: 1  # Number of processors used for queuing training batches, used only for TFDS dataloader
  eval_every_num_steps: 10000  # Number of gradient steps after which the metrics on the validation set are calculated.
  loss_weights:
    forces: 1.00  # Loss weight for the forces.
    # Uncomment if energy, dipole_vec and/or hirshfeld ratios are in the dataset and should be used in the loss.
    # energy: 1.0  # Loss weight for the energy. Pretraining used 0.01 on this per-atom loss, but at 0.01 energies barely train in a fine-tune; 1.0 trains them at no force cost.
    # dipole_vec: 0.01 
    # hirshfeld_ratios: 0.01
    # c6_ratios: 0.01
    # partial_charges: 0.01  # Per-atom charges, read from a 'partial_charges' array column.
  # Recipe 1 (see the top of this file): anchor the charge / a0 / C6 heads to the
  # pretrained model's own predictions on every batch (a frozen copy of the starting
  # weights is the teacher; one extra forward pass per batch, 2-6 % longer runs):
  # long_range_anchor_weights:
  #   partial_charges: 1.0
  #   a0_ratios: 1.0  # 'hirshfeld_ratios' for the legacy so3lr model
  #   c6_ratios: 1.0  # not predicted by the legacy so3lr model
  #   dipole_vec: 0.1  # optional; the three above were enough in our tests
  use_robust_loss: false  # Use robust loss function. See https://arxiv.org/abs/1701.03077.
  robust_loss_alpha: 1.00 # Alpha parameter for the robust loss function.
  model_seed: 42  # Seed used for the initialization of the model parameters.
  training_seed: 42  # Seed used for shuffling the batches during training.
  log_gradient_values: False  # Log the norm of the gradients for each set of weights.
  use_wandb: false  # Opt in to sending metrics and the effective config to W&B (requires `pip install .[wandb]`). No W&B calls are made while false/absent.
  wandb_init_args:  # Arguments to wandb.init(), used only when use_wandb is true. Keep credentials outside this file.
    # Uncomment `name:` to pin the run name in the WandB dashboard; if left
    # commented out, wandb.init() auto-generates a random run name. A common
    # convention is to set it to the --workdir basename so the WandB run and
    # the local checkpoint directory share a label.
    # name: finetune_so3lr
    project: so3lr
    group: finetune_so3lr
