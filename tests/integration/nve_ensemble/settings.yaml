# NVE ensemble test - microcanonical simulation
# Tests running NVE (constant energy) dynamics

input_file: input.xyz
output_file: trajectory.hdf5
log_file: so3lr.log

# Model settings
precision: float64
lr_cutoff: 12
buffer_size_multiplier_sr: 1.25
buffer_size_multiplier_lr: 1.25

# Key feature: NVE ensemble
ensemble: nve
md_T: 300.0  # Only used for initial velocity assignment
md_dt: 0.0005
md_cycles: 2
md_steps: 2
relax_before_run: false  # Don't relax for NVE

# Output settings
save_buffer: 1
total_charge: 0
seed: 42
restart_save_path: nve_restart.npz
