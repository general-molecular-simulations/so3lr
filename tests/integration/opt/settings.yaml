# Geometry optimization test for acetone
# Minimal settings for fast testing

input_file: input.gro
output_file: optimized.xyz
log_file: so3lr.log

# Model settings
precision: float64
lr_cutoff: 12.0
buffer_size_multiplier_sr: 1.25
buffer_size_multiplier_lr: 1.25

# Optimization settings - keep minimal for fast testing
min_cycles: 2
min_steps: 2
min_start_dt: 0.05
min_max_dt: 0.1
min_n_min: 2
force_convergence: 0.5  # Loose convergence for fast test

# Additional settings
total_charge: 0
