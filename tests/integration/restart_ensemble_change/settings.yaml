# Restart ensemble change test - changing from NVE to NVT on restart
# Tests loading a restart file saved with different ensemble
# Should warn but still work

input_file: input.xyz
output_file: trajectory.hdf5
log_file: so3lr.log

# Model settings
precision: float64
lr_cutoff: 12.0
dispersion_damping: 2.0
buffer_size_multiplier_sr: 1.25
buffer_size_multiplier_lr: 1.25

# Key feature: NVT ensemble but loading NVE restart
nvt: true
md_T: 300.0
md_dt: 0.0005
md_cycles: 2
md_steps: 2
relax_before_run: false

# Thermostat settings
nhc_chain_length: 3
nhc_steps: 2
nhc_thermo: 100.0

# Load NVE restart but run NVT
restart_load_path: nve_restart.npz

# Output settings
save_buffer: 1
total_charge: 0
seed: 42
