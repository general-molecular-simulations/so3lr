# K-space electrostatics (P3M) test - NPT dynamics with the P3M solver

# 512 waters (1536 atoms) in a periodic 24.8 A box: the one integration case
# that runs a dense periodic system through CLI MD, so neighbour pairs cross the
# boundary and the NPT virial includes periodic images (npt_ensemble and
# restart_checkpoint use a dilute 15-atom box). validate.py checks the box moved.
input_file: water_1536.xyz  # from tests/test_data
output_file: trajectory.hdf5
log_file: so3lr.log

# Model settings
precision: float64
lr_cutoff: 10.0  # box (24.8 A) must be >= 2 x lr_cutoff
dispersion_damping: 1.0
buffer_size_multiplier_sr: 1.25
buffer_size_multiplier_lr: 1.25

# Kspace electrostatics
kspace_electrostatics: "p3m"
kspace_smearing: 2.0
kspace_spacing: 1.0
kspace_interp_nodes: 4

# Key feature: NPT ensemble with pressure
md_T: 300.0
md_P: 1.0  # Pressure in bar - enables NPT
md_dt: 0.5
md_cycles: 2
md_steps: 2
relax_before_run: false

# Thermostat/Barostat settings
nhc_chain_length: 3
nhc_steps: 2
nhc_thermo: 100.0
nhc_baro: 1000.0

# Output settings
save_buffer: 1
total_charge: 0
seed: 42
