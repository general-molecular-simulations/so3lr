# Observables test - dipole and partial charges output
# Tests that observables are correctly computed and saved

input_file: input.xyz
output_file: trajectory.hdf5
log_file: so3lr.log

# Model settings
precision: float64
lr_cutoff: 12
buffer_size_multiplier_sr: 1.25
buffer_size_multiplier_lr: 1.25

# MD settings - minimal for fast testing
md_T: 300.0
md_dt: 0.0005
md_cycles: 2
md_steps: 2
relax_before_run: true

# Thermostat settings
nhc_chain_length: 3
nhc_steps: 2
nhc_thermo: 100.0

# Key feature: observables output
observables: ["dipole_vec", "partial_charges"]

# Output settings
save_buffer: 1
total_charge: 0
seed: 42
