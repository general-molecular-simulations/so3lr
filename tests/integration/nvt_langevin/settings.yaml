# NVT simulation test for acetone in vacuum
# Minimal settings for fast testing

input_file: input.gro
output_file: trajectory.hdf5
log_file: so3lr.log

# Model settings
precision: float64
lr_cutoff: 12.0
dispersion_damping: 2.0
buffer_size_multiplier_sr: 1.25
buffer_size_multiplier_lr: 1.25

# MD settings - keep minimal for fast testing
md_T: 300.0
md_dt: 0.0005
md_cycles: 2
md_steps: 2
relax_before_run: false

# Thermostat settings
ensemble: nvt-langevin
langevin_gamma: 0.1

# Output settings
save_buffer: 1
total_charge: 0
seed: 42
