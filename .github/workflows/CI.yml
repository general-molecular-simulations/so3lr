name: CI
on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main]

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode: short (skip slow tests) or full (run all tests)'
        required: false
        default: 'short'
        type: choice
        options:
          - short
          - full
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            name: "mlff"
            # The TFDS data-loader test (test_data_loader_tfds.py) imports
            # tensorflow at module top, which would abort collection on a
            # base install. The [tfds] extra pulls in tensorflow-cpu +
            # tensorflow-datasets so the test runs in CI.
            install_extras: "[tfds]"
            run_short: "pytest tests/mlff_tests/ -v --tb=short"
            run_full: "pytest tests/mlff_tests/ -v --tb=short --full"
          - group: 2
            name: "so3lr-cli"
            install_extras: ""
            run_short: "pytest tests/test_cli_eval.py tests/test_cli_train.py tests/test_cli_finetune.py tests/test_cli.py -v --tb=short"
            run_full: "pytest tests/test_cli_eval.py tests/test_cli_train.py tests/test_cli_finetune.py tests/test_cli.py -v --tb=short --full"
          # tests/test_integration.py ran ~31-41 min as a single job -- the
          # critical path for the whole workflow, and long enough that runners
          # were twice reclaimed mid-run (SIGTERM, exit 143, no test failure).
          # --shard splits it into duration-balanced thirds using the timings in
          # tests/conftest.py, so a newly added test case is distributed
          # automatically rather than needing to be named here.
          - group: 3
            name: "integration-1"
            install_extras: ""
            run_short: "pytest tests/test_integration.py --shard 1/3 -v --tb=short"
            run_full: "pytest tests/test_integration.py --shard 1/3 -v --tb=short --full"
          - group: 4
            name: "integration-2"
            install_extras: ""
            run_short: "pytest tests/test_integration.py --shard 2/3 -v --tb=short"
            run_full: "pytest tests/test_integration.py --shard 2/3 -v --tb=short --full"
          - group: 5
            name: "integration-3"
            install_extras: ""
            run_short: "pytest tests/test_integration.py --shard 3/3 -v --tb=short"
            run_full: "pytest tests/test_integration.py --shard 3/3 -v --tb=short --full"
          - group: 6
            name: "so3lr-other"
            install_extras: ""
            run_short: "pytest tests/test_potential.py tests/test_readme.py tests/test_ase.py tests/test_jaxmd.py tests/test_observables.py tests/test_observable_gradients.py tests/test_pme.py -v --tb=short"
            run_full: "pytest tests/test_potential.py tests/test_readme.py tests/test_ase.py tests/test_jaxmd.py tests/test_observables.py tests/test_observable_gradients.py tests/test_pme.py tests/test_hessian.py -v --tb=short --full"
          - group: 7
            name: "pysages"
            install_extras: "[pysages]"
            # All pysages-touching interface tests must run on every PR
            # (including the @pytest.mark.slow integration tests) to guarantee
            # the PySAGES <-> SO3LR interface is exercised before merge.
            # Both run_short and run_full therefore pass --full.
            #
            # test_pysages_doublewell.py is intentionally NOT listed here: it
            # validates PySAGES' own jax-md backend (not the so3lr interface)
            # and is opt-in only via explicit invocation.
            run_short: "pytest tests/test_pysages_interface.py tests/test_restart_coordinates.py -v --tb=short --full"
            run_full: "pytest tests/test_pysages_interface.py tests/test_restart_coordinates.py -v --tb=short --full"
    runs-on: ubuntu-latest
    name: "${{ matrix.name }}"
    timeout-minutes: ${{ (github.event.inputs.test_mode == 'full' || contains(github.event.head_commit.message, '[full tests]')) && 90 || 60 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Get pip cache dir
        id: pip-cache
        run: |
          python -m pip install --upgrade pip wheel
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: pip cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

      - name: Test with pytest
        # TEST_MODE / HEAD_COMMIT_MESSAGE are passed through the environment
        # rather than interpolated into the script body: a commit message
        # containing a double quote used to be spliced in raw and broke the
        # `if` into invalid bash (all jobs exited 2 before collecting a single
        # test). head_commit is absent on pull_request events, so the variable
        # is empty there and the [full tests] check is simply false.
        env:
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          pip install ".${{ matrix.install_extras }}"
          pip install pytest
          if [ "$TEST_MODE" = "full" ] || [[ "$HEAD_COMMIT_MESSAGE" == *"[full tests]"* ]]; then
            echo "Running FULL test suite"
            ${{ matrix.run_full }}
          else
            echo "Running SHORT test suite"
            ${{ matrix.run_short }}
          fi
