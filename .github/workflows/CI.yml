name: CI
on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main]

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode: short (skip slow tests) or full (run all tests)'
        required: false
        default: 'short'
        type: choice
        options:
          - short
          - full
jobs:
  ci:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.test_mode == 'full' && 60 || 30 }}
    steps:
      - uses: actions/checkout@v2
      
      - uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Get pip cache dir
        id: pip-cache
        run: |
          python -m pip install --upgrade pip wheel
          echo "::set-output name=dir::$(pip cache dir)"

      - name: pip cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/setup.py') }}

      - name: Test with pytest
        run: |
          pip install .
          pip install pytest
          if [ "${{ github.event.inputs.test_mode }}" = "full" ] || [[ "${{ github.event.head_commit.message }}" == *"[full tests]"* ]]; then
            echo "Running FULL test suite (including slow tests)"
            pytest tests/ -v --tb=short --full
          else
            echo "Running SHORT test suite (skipping slow tests)"
            pytest tests/ -v --tb=short
          fi
      
