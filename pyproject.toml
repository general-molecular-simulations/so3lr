[tool.poetry]
name = "so3lr"
version = "0.1.0"
description = "SO3krates Universal Pairwise Force Field with Long Range Interactions (SO3LR) for Molecular Simulation"
authors = ["Adil Kabylda, Thorben Frank"]
license = "MIT"


[tool.poetry.dependencies]
python = ">=3.12"
numpy = "*"
ase = "*"
h5py = "*"
setuptools = "<81"
jax = "*"
jaxlib = "*"
orbax-checkpoint = "*"
e3x = "*"
flax = "*"
optax = "*"
tqdm = "*"
wandb = "*"
pyyaml = "*"
ml_collections = "*"
click = "*"
jraph = { git = "https://github.com/google-deepmind/jraph.git", branch = "master", optional = false }
jax-md = { git = "https://github.com/jax-md/jax-md.git", branch = "main" , optional = false }
glp = { git = "https://github.com/kabylda/glp.git", branch = "electrostatics_neighbourlist", optional = false }
jax-pme = { git = "https://github.com/fbruenig/jax-pme", branch = "main" , optional = false }


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
so3lr = "so3lr.cli.so3lr_cli:main"
